org.gradle.jvmargs=-Xmx8g
android.useAndroidX=true
# AGP 9.0 removed the legacy variant API; opt out keeps shared make/android/*.gradle Groovy logic working
# (deprecated warnings; opt-out is removed in AGP 10 - migrate to androidComponents before then)
android.newDsl = false
# KSP wires generated sources via kotlin.sourceSets; suppress the built-in-Kotlin hard error
android.disallowKotlinSourceSets = false
# AGP 9 defaults unit tests to the tested build type (debug) only; restore per-build-type tests
android.onlyEnableUnitTestForTheTestedBuildType = false